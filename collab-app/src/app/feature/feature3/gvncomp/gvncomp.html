<h2>Cart</h2>

<button (click)="addApple()">Add Apple ($2)</button>
<button (click)="addBanana()">Add Banana ($1)</button>

<p>Total items: {{ cart.totalItems() }}</p>
<p>Total price: {{ cart.totalPrice() | currency }}</p>

<ul>
  <li *ngFor="let item of cart.items()">
    {{ item.name }} × {{ item.quantity }}
    = {{ item.price * item.quantity | currency }}

    <button (click)="cart.decrease(item.id)">➖</button>
  </li>
</ul>

<button (click)="cart.clear()">Clear Cart</button>
